<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive visualization of an exoplanet clock." />
  <title>Alien Clock Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="panel" aria-labelledby="app-title">
      <header class="header">
        <div><p class="eyebrow">EXOPLANET TIME SYSTEM</p><h1 id="app-title">Alien Clock Visualizer</h1></div>
        <div class="circle-badge">677°</div>
      </header>
      <div class="content-grid">
        <div class="clock-column">
          <div class="clock" aria-label="Visual clock face">
            <div class="hand hand-hour" id="hour-hand"></div>
            <div class="hand hand-minute" id="minute-hand"></div>
            <div class="hub"></div>
          </div>
          <div class="stats">
            <div class="stat"><span class="stat-label">HOUR HAND</span><strong id="hour-angle">0.000°</strong></div>
            <div class="stat"><span class="stat-label">MINUTE HAND</span><strong id="minute-angle">0.000°</strong></div>
          </div>
        </div>
        <div class="controls-column">
          <div class="time-inputs">
            <label class="field"><span>HOUR</span><input id="hour" type="number" min="0" max="12" step="1" value="6" /></label>
            <span class="colon">:</span>
            <label class="field"><span>MINUTE</span><input id="minute" type="number" min="0" max="36" step="1" value="18" /></label>
          </div>
          <div class="result-card">
            <span class="result-label">SMALLER ANGLE BETWEEN HANDS</span>
            <div class="result-row"><strong id="result">9.852°</strong><span class="unit">alien degrees</span></div>
            <div class="meter"><div class="meter-fill" id="meter-fill"></div></div>
          </div>
          <p id="error" class="error" role="alert"></p>
          <div class="rules">
            <div><strong>13</strong><span>HOURS / ROTATION</span></div>
            <div><strong>37</strong><span>MINUTES / HOUR</span></div>
            <div><strong>677</strong><span>DEGREES / CIRCLE</span></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
